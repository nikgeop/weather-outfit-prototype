<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App Prototype</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="main-page">
      <div class="top-bar">
        <button id ="weather-scroll-left">←☁</button>
        <div style="flex:1"></div>
        <button id="weather-scroll-right">👕→</button>
      </div>
      <div id="main-weather-container">
        <button id="scroll-arrow-left" class="scroll-arrow"><</button>
        <div class="weather-container">
        </div>
        <button id="scroll-arrow-right" class="scroll-arrow">></button>
      </div>
      <div class="divider" style="background-color: black; width:90%, height: 2px"></div>
      <div id="todays-picks-container">
        <Text>Todays Top Picks</Text>
        <button id="refresh-button" class="button-icon">⟳</button>
      </div>
      <div id="outfit-grid">
                <div id="shirt" class="outfit"></div>
                <div id="pants" class="outfit"></div>
                <div id="shoes" class="outfit"></div>
            </div>
        </div>

                    <!-- Weather report page -->
        <div id="weather-report-page" style="display:none;">
            <div class="top-bar">
              <button id="back-to-main-1">← Back</button>
              <div style="flex:1"></div>
            </div>
            <div id="weather-main">
                <h2>Weather Report</h2>
                <!-- Add your form or upload buttons here -->
            </div>
        </div>

            <!-- Add clothing page -->
        <div id="add-clothing-page" style="display:none;">
            <div class="top-bar">
              <button id="back-to-main-2">← Back</button>
              <div style="flex:1"></div>
            </div>
            <div id="clothing-main">
                <h2>Your Closet</h2>
                <!-- Add your form or upload buttons here -->
                <div id="closet">
                    <div id="hot-shirt-1" class="clothes" style="background-image: url('https://www.mrbigandtall.ca/cdn/shop/products/BW-5463-964-1101_black_1800x.jpg?v=1656516131')"></div>
                    <div id="cold-shirt-1" class="clothes" style="background-image: url('https://coach.scene7.com/is/image/Coach/cbd41_blk_a0?$mobileProductTile$')"></div>
                    <div id="neutral-shirt-1" class="clothes" style="background-image: url('https://image.hm.com/assets/hm/bf/74/bf7470dac19e9447f0a0d7497a1b3b01f47563c0.jpg?imwidth=768')"></div>
                    <div id="hot-pants-2" class="clothes" style="background-image: url('https://rab.equipment/media/catalog/product/w/o/womens_torque_mountain_shorts_orionblue_qfv_97_orb.jpg?optimize=medium&fit=bounds&height=&width=')"></div>
                    <div id="cold-pants-2" class="clothes" style="background-image: url('https://img.abercrombie.com/is/image/anf/KIC_131-3206-0029-278_prod1?policy=product-large')"></div>
                    <div id="neutral-pants-2" class="clothes" style="background-image: url('https://cdni.llbean.net/is/image/wim/505026_33335_41')"></div>
                    <div id="hot-shoes-3" class="clothes" style="background-image: url('https://ca.archiesfootwear.com/cdn/shop/files/WhiteBirdsEye_1000x.jpg?v=1683182535')"></div>
                    <div id="cold-shoes-3" class="clothes" style="background-image: url('https://assets.timberland.com/images/t_Thumbnail/v1741199070/TB110061713-HERO/Mens-Timberland-Premium-6Inch-Waterproof-Boot.png')"></div>
                    <div id="neutral-shoes-3" class="clothes" style="background-image: url('https://asics.scene7.com/is/image/asics/1183C429_200_SR_RT_GLB?$otmag_zoom$&qlt=99,1')"></div>
                </div>
            </div>
        
      </div>
    </div>
    <script src="main/main.js"></script>
  </body>
</html>
