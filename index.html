<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App Prototype</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="main-page">
            <div class="top-bar">
                <button id="weather-scroll-left">←☁</button>
                <div style="flex:1"></div>
                <button id="weather-scroll-right">👕→</button>
            </div>

            <div id="main-weather-container">
                <button id="weather-scroll-left" class="button-icon"></button>
                <div class="weather-container">


                    <div class="weather-slot">
                        <div style="font-size: min(3vw, 3vh)">1AM</div>
                        <div style="font-size: min(5vw, 5vh)">🌧</div>
                        <div style="font-size: min(3vw, 3vh)">4°C</div>
                    </div>
                    <div class="weather-slot">
                        <div style="font-size: min(3vw, 3vh)">2AM</div>
                        <div style="font-size: min(5vw, 5vh)">🌧</div>
                        <div style="font-size: min(3vw, 3vh)">5°C</div>
                    </div>

                </div>

                <button id="weather-scroll-right" class="button-icon">></button>
            </div>

            <div style="background-color: black; width:80%; height: 2px"></div>
            <div id="todays-picks-container">
                <Text>Todays Top Picks</Text>
                <button id="refresh-button" class="button-icon">⟳</button>
            </div>
            <div id="outfit-grid">
                <div id="outfit-shirt-1" class="outfit"></div>
                <div id="outfit-shirt-2" class="outfit"></div>
                <div id="outfit-shirt-3" class="outfit"></div>
                <div id="outfit-pants-1" class="outfit"></div>
                <div id="outfit-pants-2" class="outfit"></div>
                <div id="outfit-pants-3" class="outfit"></div>
                <div id="outfit-shoes-1" class="outfit"></div>
                <div id="outfit-shoes-2" class="outfit"></div>
                <div id="outfit-shoes-3" class="outfit"></div>
            </div>
        </div>

                    <!-- Weather report page -->
        <div id="weather-report-page" style="display:none;">
            <div class="top-bar">
              <button id="back-to-main-1">← Back</button>
              <div style="flex:1"></div>
            </div>
            <div id="weather-main">
                <h2>Weather Report</h2>
                <!-- Add your form or upload buttons here -->
            </div>
        </div>

            <!-- Add clothing page -->
        <div id="add-clothing-page" style="display:none;">
            <div class="top-bar">
              <button id="back-to-main-2">← Back</button>
              <div style="flex:1"></div>
            </div>
            <div id="clothing-main">
                <h2>Add New Clothing</h2>
                <!-- Add your form or upload buttons here -->
            </div>
        </div>
        <script src="main/main.js"></script>
    </body>
</html>
